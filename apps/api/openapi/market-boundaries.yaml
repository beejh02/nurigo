openapi: 3.1.0
info:
  title: Nurigo Market Boundary API
  version: 0.1.0
  description: >-
    전통시장 경계 조회, 서버 권위 지오펜스 판정과 관리자용 경계 revision
    등록·검수 계약입니다.
paths:
  /v1/markets:
    get:
      operationId: listMarkets
      summary: 검수된 전통시장 목록 조회
      parameters:
        - name: regionCode
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 시장 목록
          content:
            application/json:
              schema:
                type: object
                required: [markets]
                properties:
                  markets:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketSummary'
  /v1/markets/{marketId}/boundary:
    get:
      operationId: getVerifiedMarketBoundary
      summary: 시장의 현재 verified 경계 조회
      parameters:
        - $ref: '#/components/parameters/MarketId'
      responses:
        '200':
          description: 현재 verified 경계
          headers:
            ETag:
              description: 시장 ID와 revision으로 생성한 캐시 검증자
              schema:
                type: string
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/MarketBoundaryFeature'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/geofence/check:
    post:
      operationId: checkMarketGeofence
      summary: 현재 verified revision으로 서버 권위 위치 판정
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceCheckRequest'
      responses:
        '200':
          description: 판정 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeofenceCheckResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 클라이언트 경계 revision이 현재 서버 revision과 다름
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/admin/markets:
    post:
      operationId: createMarketWithBoundaryDraft
      summary: 새 시장과 첫 경계 draft를 함께 등록
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/geo+json:
            schema:
              $ref: '#/components/schemas/NewMarketBoundaryDraftFeature'
      responses:
        '201':
          description: 생성된 시장의 첫 draft
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/MarketBoundaryFeature'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidBoundary'
        '503':
          $ref: '#/components/responses/AdminAuthNotConfigured'
  /v1/admin/markets/{marketId}/boundaries:
    post:
      operationId: createMarketBoundaryDraft
      summary: 다음 경계 revision을 draft로 등록
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
      requestBody:
        required: true
        content:
          application/geo+json:
            schema:
              $ref: '#/components/schemas/MarketBoundaryDraftFeature'
      responses:
        '201':
          description: 생성된 draft
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/MarketBoundaryFeature'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidBoundary'
        '503':
          $ref: '#/components/responses/AdminAuthNotConfigured'
  /v1/admin/markets/{marketId}/boundaries/{revision}/verify:
    post:
      operationId: verifyMarketBoundary
      summary: draft revision 검수 및 배포
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: revision
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: verified로 전환된 경계
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/MarketBoundaryFeature'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: draft가 아니거나 revision 전환 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/AdminAuthNotConfigured'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        초기 관리자 API는 환경변수로 주입한 opaque Bearer token을 사용합니다.
        운영 사용자·관리자 인증 형식은 후속 인증 ADR에서 확정합니다.
  parameters:
    MarketId:
      name: marketId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  responses:
    InvalidRequest:
      description: path, query 또는 JSON 요청 형식이 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Bearer token이 없거나 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 시장 또는 경계를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AdminAuthNotConfigured:
      description: 서버에 관리자 인증 token이 설정되지 않아 관리자 API가 닫혀 있음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidBoundary:
      description: 경계 형식 또는 geometry가 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    MarketSummary:
      type: object
      required: [id, name, regionCode, boundaryRevision]
      properties:
        id:
          type: string
        name:
          type: string
        regionCode:
          type: string
        boundaryRevision:
          type: integer
          minimum: 1
    Position:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: number
          minimum: -180
          maximum: 180
        - type: number
          minimum: -90
          maximum: 90
      items: false
    LinearRing:
      type: array
      minItems: 4
      items:
        $ref: '#/components/schemas/Position'
    PolygonCoordinates:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/LinearRing'
    MultiPolygonCoordinates:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/PolygonCoordinates'
    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: Polygon
        coordinates:
          $ref: '#/components/schemas/PolygonCoordinates'
    MultiPolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          const: MultiPolygon
        coordinates:
          $ref: '#/components/schemas/MultiPolygonCoordinates'
    MarketBoundaryProperties:
      type: object
      required: [marketId, name, regionCode, revision, status]
      properties:
        marketId:
          type: string
        name:
          type: string
        regionCode:
          type: string
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, verified, retired]
    MarketBoundaryFeature:
      type: object
      required: [type, id, properties, geometry]
      properties:
        type:
          const: Feature
        id:
          type: string
        properties:
          $ref: '#/components/schemas/MarketBoundaryProperties'
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PolygonGeometry'
            - $ref: '#/components/schemas/MultiPolygonGeometry'
    MarketBoundaryDraftFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          const: Feature
        properties:
          type: object
          properties:
            source:
              type: object
              additionalProperties: true
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PolygonGeometry'
            - $ref: '#/components/schemas/MultiPolygonGeometry'
    NewMarketBoundaryDraftFeature:
      type: object
      required: [type, properties, geometry]
      properties:
        type:
          const: Feature
        properties:
          type: object
          required: [name, regionCode]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
            regionCode:
              type: string
              pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
              maxLength: 50
            source:
              type: object
              additionalProperties: true
        geometry:
          oneOf:
            - $ref: '#/components/schemas/PolygonGeometry'
            - $ref: '#/components/schemas/MultiPolygonGeometry'
    DevicePosition:
      type: object
      required: [latitude, longitude, accuracyMeters, capturedAt]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
        capturedAt:
          type: string
          format: date-time
    GeofenceCheckRequest:
      type: object
      required: [marketId, boundaryRevision, position]
      properties:
        marketId:
          type: string
        boundaryRevision:
          type: integer
          minimum: 1
        position:
          $ref: '#/components/schemas/DevicePosition'
    GeofenceCheckResult:
      type: object
      required: [marketId, boundaryRevision, inside, checkedAt]
      properties:
        marketId:
          type: string
        boundaryRevision:
          type: integer
          minimum: 1
        inside:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
