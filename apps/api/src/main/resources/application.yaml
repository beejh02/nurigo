spring:
  application:
    name: nurigo-api
  datasource:
    url: ${NURIGO_DB_URL:jdbc:postgresql://localhost:5432/nurigo}
    username: ${NURIGO_DB_USERNAME:nurigo}
    password: ${NURIGO_DB_PASSWORD:nurigo}
  flyway:
    locations: classpath:db/migration

server:
  address: ${NURIGO_SERVER_ADDRESS:127.0.0.1}
  port: ${NURIGO_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

nurigo:
  security:
    admin-token: ${NURIGO_ADMIN_TOKEN:}
